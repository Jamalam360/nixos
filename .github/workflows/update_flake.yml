name: Update flake.lock

on:
  schedule:
    - cron: 38 5 * * 1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Close stale flake-update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --label flake-update --state open --json number --jq '.[].number' | \
          while read -r pr; do
            gh pr close "$pr" --delete-branch
          done

      - name: Allow unprivileged user namespaces (needed for some sandboxed tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Update flake.lock
        run: nix flake update --accept-flake-config

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all nixosConfigurations
        if: steps.diff.outputs.changed == 'true'
        id: build
        run: |
          set -o pipefail
          echo "## Build results" > build_report.md
          status=0
          max_attempts=3
 
          build() {
            nix build ".#nixosConfigurations.$1.config.system.build.toplevel" \
              --accept-flake-config --no-link -L --keep-going \
              --option download-attempts 5 \
              --option connect-timeout 10 2>&1 | tee "build-$1.log"
          }
 
          for name in $(nix flake show --json --accept-flake-config 2>/dev/null | jq -r '.nixosConfigurations // {} | keys[]'); do
            case "$name" in
              *-iso) continue ;;
            esac
 
            ok=false
            for attempt in $(seq 1 "$max_attempts"); do
              echo "::group::$name (attempt $attempt/$max_attempts)"
              if build "$name"; then ok=true; echo "::endgroup::"; break; fi
              echo "::endgroup::"
              [ "$attempt" -lt "$max_attempts" ] && sleep $((attempt * 120))
            done
 
            if $ok; then
              note=""; [ "$attempt" -gt 1 ] && note=" (after $attempt attempts)"
              echo "### ✅ $name built$note" >> build_report.md
            else
              status=1
              {
                echo "### ❌ $name failed after $max_attempts attempts"
                echo
                echo "<details><summary>Errors</summary>"
                echo
                echo '```'
                grep -E '^error: Cannot build|Reason:|^ +> ' "build-$name.log" | grep -v 'dependency failed' | tail -n 40
                echo '```'
                echo "</details>"
              } >> build_report.md
            fi
          done
          exit "$status"
        continue-on-error: true

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "deps: update flake.lock"
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
          branch: flake-update-${{ github.run_id }}
          delete-branch: true
          title: "deps: update flake.lock (${{ steps.build.outcome == 'success' && 'build pass' || 'build failures' }})"
          body-path: build_report.md
          add-paths: flake.lock
          draft: always-true
          labels: flake-update
